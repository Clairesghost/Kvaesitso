name: Build debug APK (branch check)

# Builds an installable debug APK for any claude/* branch, with no signing secrets.
# Debug builds install next to the original launcher (applicationIdSuffix .debug); nothing is replaced.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vintage-pocket-dial-debug-apk
          path: app/app/build/outputs/apk/default/debug/*.apk

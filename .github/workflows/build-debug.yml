name: Build debug APK (branch check)

# Builds an installable debug APK for any claude/* branch, signed with the owner's fixed debug key (secret DEBUG_KEYSTORE_BASE64).
# Debug builds install next to the original launcher (applicationIdSuffix .debug); nothing is replaced.
on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
      - name: Write the fixed debug key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Fixed debug key missing: add the DEBUG_KEYSTORE_BASE64 secret"
            exit 1
          fi
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build debug APK
        run: ./gradlew assembleDefaultDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: vintage-pocket-dial-debug-apk
          path: app/app/build/outputs/apk/default/debug/*.apk

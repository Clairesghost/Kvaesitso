<title>Alert Row Options</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700;800&family=Oleo+Script+Swash+Caps:wght@700&family=DM+Sans:wght@400;500;700&display=swap">
<style>
:root{--pg:#f3efe8;--pgfg:#241f1b;--pgmute:#6d655c;--pgline:#d8d0c3;--pgcard:#fffdf9}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--pg:#17151a;--pgfg:#efe9df;--pgmute:#a59d92;--pgline:#35303a;--pgcard:#201d25;color-scheme:dark}}
:root[data-theme="dark"]{--pg:#17151a;--pgfg:#efe9df;--pgmute:#a59d92;--pgline:#35303a;--pgcard:#201d25;color-scheme:dark}
body{background:var(--pg);color:var(--pgfg);font-family:"DM Sans",system-ui,sans-serif;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto}
h1{font-size:26px;margin:0 0 6px;text-wrap:balance}
.lead{color:var(--pgmute);margin:0 0 20px;max-width:66ch}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.opt{background:var(--pgcard);border:1px solid var(--pgline);border-radius:12px;padding:12px;min-width:0}
.opt h2{font-size:13px;margin:0 0 8px;display:flex;justify-content:space-between;gap:8px}
.opt h2 span{color:var(--pgmute);font-weight:400;font-size:12px}
.note{font-size:13px;color:var(--pgmute);margin:0}
.plac{font-family:"Libre Franklin",sans-serif;background:linear-gradient(#f2edd2,#e4dcbb);color:#15110f;border:3px solid #141010;border-radius:6px;padding:0 10px 2px;box-shadow:0 0 0 2px #dcdedf,0 0 0 3.5px #7d7f82;margin:4px 3px 8px}
.h{display:flex;justify-content:space-between;align-items:center;height:22px;font-family:"Oleo Script Swash Caps",cursive;font-weight:700;font-size:15px}
.h span{font-family:"Libre Franklin",sans-serif;font-size:11px;font-weight:500;opacity:.75}
.r{display:flex;align-items:center;gap:6px;height:28px;font-size:12px;border-top:1px dotted rgba(20,16,16,.35)}
.t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t span{opacity:.75}
.r em{font-style:normal;font-size:10.5px;opacity:.65}
.g{width:16px;height:16px;flex:none;border:1.5px solid currentColor;border-radius:4px}
.x{font-size:12px;width:22px;text-align:center;opacity:.7}
.bt{height:20px;padding:0 9px;border-radius:10px;font-size:10.5px;display:flex;align-items:center}
/* current */
.cur .t b{font-weight:800;margin-right:6px}.cur .bt{background:#15110f;color:#efe8c8;font-weight:700}
/* A */
.oa .t b{font-weight:600;margin-right:6px}.oa .bt{border:1px solid #15110f;font-weight:500}
/* B */
.ob .t b{font-weight:500;margin-right:6px}.ob .bt{padding:0;color:#8d141d;font-weight:600}
/* C */
.oc .t b{font-weight:600;margin-right:6px}.oc .bt{background:#e0cf9f;color:#15110f;font-weight:600;box-shadow:inset 0 0 0 1px rgba(20,16,16,.18)}
/* D */
.od .t b{font-weight:500;margin-right:6px}.od .bt{width:22px;height:22px;padding:0;justify-content:center;border-radius:50%;color:#8d141d;font-size:13px;font-weight:700;background:radial-gradient(circle at 35% 30%,#fff,#c3c5c8 60%,#8f9194);box-shadow:inset 0 0 0 1.5px #e9e9e6,0 1px 1px rgba(0,0,0,.4)}
</style>
<div class="wrap">
<h1>Alert row options</h1>
<p class="lead">Quieter ways to show the sender names and the Open button. The first sample is how it is now. The others make the names lighter and the button softer, so your eye reads the message first.</p>
<div class="grid" id="g"></div>
</div>
<script>
var O=[
["Now","cur","names extra bold, solid black pill","What you are seeing now."],
["A. Outlined pill","oa","names semi-bold, button is an outline","Still clearly a button, but quiet. My pick."],
["B. Red text link","ob","names medium, button is plain red text","Lightest. The button looks like a link; the word 'Open ›' is easy to miss on a fat thumb."],
["C. Soft tan pill","oc","names semi-bold, button is a tan pill","Blends into the card, still tappable."],
["D. Chrome coin","od","names medium, button is a small coin with an arrow","Matches the coins on the search bar. Shows an arrow, not a word."]
];
var g=document.getElementById("g");
O.forEach(function(o){
  var arrow=o[1]==="od"?"›":"Open";
  var d=document.createElement("div");d.className="opt";
  d.innerHTML='<h2>'+o[0]+'<span>'+o[2]+'</span></h2><div class="plac '+o[1]+'"><div class="h">Alerts<span>+1 more ›</span></div><div class="r"><div class="g"></div><div class="t"><b>Messages</b><span>3 new</span></div><em>2 min</em><div class="bt">'+(o[1]==="od"?"›":"Reply")+'</div><div class="x">✕</div></div><div class="r"><div class="g"></div><div class="t"><b>Mail</b><span>2 new</span></div><em>35 min</em><div class="bt">'+(o[1]==="od"?"›":"Open")+'</div><div class="x">✕</div></div></div><p class="note">'+o[3]+'</p>';
  g.appendChild(d);
});
</script>

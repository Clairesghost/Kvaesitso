body{background:#222;font-family:var(--bodyf),sans-serif}
.phone{font-family:var(--bodyf),sans-serif;position:relative;width:360px;height:800px;overflow:hidden;background:radial-gradient(120% 70% at 50% 0%,var(--ground) 0%,var(--ground2) 100%);color:var(--text)}

.abs{position:absolute}

.cell{position:absolute;width:86px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--text)}
.lbl{font-size:12px;line-height:1.1;text-align:center}
.sw{position:absolute;width:104px;display:flex;flex-direction:column;align-items:center;gap:5px}
.sw .t{font-size:12px;letter-spacing:1px}
.sw .s{font-size:10.5px;color:var(--muted);text-align:center;line-height:1.1;font-family:var(--bodyf)}
.drawer{width:70px;height:62px;position:relative}
